<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>コントロールパネル | デモ操作</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="admin-body" style="padding: 20px;">
  
  <div class="admin-header" style="margin-bottom: 20px;">
    <h1>⚙️ 発表者用コントロールパネル</h1>
    <div style="color: #58a6ff; font-weight: bold;">緊急時・保険用データ送出ツール</div>
  </div>

  <div style="background: #161b22; border: 1px solid #30363d; padding: 20px; border-radius: 8px; max-width: 500px; margin: 0 auto;">
    <h3 style="color: #c9d1d9; margin-bottom: 10px;">🚀 即時データ強制送信</h3>
    <p style="font-size: 13px; color: #8b949e; margin-bottom: 15px;">本番で万が一スマホからの入力に手間取った際、このボタンを押すだけでPCの管理者画面にダミーデータを一瞬で反映させることができます。</p>
    
    <div style="margin-bottom: 12px;">
      <label style="display:block; font-size:12px; color:#8b949e; margin-bottom:4px;">送信するユーザーID</label>
      <input type="text" id="target-user" value="victim_demo@secure.jp" style="width: 100%; padding: 8px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 4px;">
    </div>
    <div style="margin-bottom: 20px;">
      <label style="display:block; font-size:12px; color:#8b949e; margin-bottom:4px;">送信するパスワード</label>
      <input type="text" id="target-pass" value="p@ssword!2026" style="width: 100%; padding: 8px; background: #0d1117; border: 1px solid #30363d; color: white; border-radius: 4px;">
    </div>

    <button onclick="sendDirectData()" style="padding: 12px 20px; background: #238636; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; font-size: 14px;">⚡ 管理者画面へデータを強制送信する</button>
  </div>

  <script>
    function sendDirectData() {
      // 同じGitHubリポジトリ内にある admin.html をターゲットにする
      const adminBaseUrl = "admin.html";
      
      const username = document.getElementById('target-user').value;
      const password = document.getElementById('target-pass').value;
      const device = "Control Panel (Emergency)";
      const time = new Date().toLocaleTimeString();

      const params = new URLSearchParams({
        time: time,
        device: device,
        username: username,
        password: password
      });

      // 管理者画面にジャンプしてデータを渡す
      window.location.href = `${adminBaseUrl}?${params.toString()}`;
    }
  </script>
</body>
</html>
